name: Issue triage
on:
  issues:
    types: [opened, reopened]
permissions:
  contents: read
jobs:
  triage:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      issues: write
    steps:
      - uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const name = 'needs-triage';
            try {
              await github.rest.issues.getLabel({...context.repo, name});
            } catch (error) {
              if (error.status !== 404) throw error;
              try {
                await github.rest.issues.createLabel({...context.repo, name, color: 'fbca04', description: 'Maintainer goal requires scope and measurable acceptance criteria'});
              } catch (created) {
                if (created.status !== 422) throw created;
              }
            }
            await github.rest.issues.addLabels({...context.repo, issue_number: context.issue.number, labels: [name]});
