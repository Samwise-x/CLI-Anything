name: Governance
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: governance-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  tooling:
    name: tooling
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Test bounded goal runner
        run: python -m unittest discover -s tools/tests -v
      - name: Policy checks
        run: python tools/check_governance.py
      - name: OpenCode config check
        run: python tools/check_opencode_config.py
      - name: Install workflow linter
        run: python -m pip install pre-commit==4.2.0 ruff==0.17.1
      - name: Lint all GitHub workflows
        run: pre-commit run actionlint --all-files
      - name: Lint Python correctness
        run: ruff check tools --select E9,F63,F7,F82
      - name: Build Linux isolation image
        run: docker build -t cli-anything-opencode-sandbox:local - < .opencode/sandbox.Dockerfile
      - name: Exercise real executor and reviewer isolation
        env:
          RUN_SANDBOX_LIVE: '1'
        run: python -m unittest tools.tests.test_opencode_sandbox -v
      - name: Validate generated root skill contracts
        run: python .github/scripts/validate_root_skills.py
      - name: Exercise Codex and Cursor installers
        run: |
          bash codex-skill/tests/test_install.sh
          bash cursor-plugin/tests/test_install.sh
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - name: Exercise PR triage contracts
        run: |
          node --check .github/scripts/pr-labeler.js
          node .github/scripts/tests/pr-labeler.test.js
  harnesses:
    name: harness (${{ matrix.directory }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        include:
          - directory: cc-switch
            package: ccswitch
          - directory: macrocli
            package: macrocli
          - directory: n8n
            package: n8n
          - directory: notebooklm
            package: notebooklm
          - directory: obsidian
            package: obsidian
    defaults:
      run:
        working-directory: ${{ matrix.directory }}/agent-harness
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install harness and offline test runner
        run: python -m pip install pytest==8.4.2 -e .
      - name: Run harness regression contracts
        run: python -m pytest cli_anything/${{ matrix.package }}/tests -q -m 'not e2e'
  deterministic:
    name: deterministic
    if: ${{ always() }}
    needs: [tooling, harnesses]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every deterministic stage
        env:
          TOOLING: ${{ needs.tooling.result }}
          HARNESSES: ${{ needs.harnesses.result }}
        run: test "$TOOLING" = success && test "$HARNESSES" = success
