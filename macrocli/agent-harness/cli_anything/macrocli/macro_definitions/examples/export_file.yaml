name: export_file
version: "1.0"
description: >
  Export a file from the target application using its native CLI.
  Demonstrates the native_api backend with a run_command action.
  Replace the command with your actual application's export command.
tags: [export, native_api, example]

parameters:
  output:
    type: string
    required: true
    description: Destination file path for the export.
    example: /tmp/exported.txt
  input:
    type: string
    required: false
    default: ""
    description: Source file to export from (optional, app-dependent).
  format:
    type: string
    required: false
    default: plain
    description: Output format.
    enum: [plain, json, csv]

preconditions: []

steps:
  - id: step_export
    backend: native_api
    action: run_command
    params:
      # Replace this with your real export command, e.g.:
      # command: [inkscape, --export-filename, "${output}", "${input}"]
      command: [python, "-c", "import pathlib,sys; pathlib.Path(sys.argv[1]).write_text('Exported to ' + sys.argv[1] + ' (format=' + sys.argv[2] + ')', encoding='utf-8')", "${output}", "${format}"]
      capture_stdout: true
    timeout_ms: 30000
    on_failure: fail

postconditions:
  - file_exists: ${output}
  - file_size_gt: ["${output}", 0]

outputs:
  - name: exported_file
    path: ${output}
    description: Path where the export was written.

agent_hints:
  danger_level: safe
  side_effects: [creates_file]
  reversible: true
  estimated_duration_ms: 2000
